@if (page) {
  <section class="page-hero">
    <div class="container narrow">
      <p class="badge badge--muted">Demo placeholder</p>
      <h1>{{ page.title }}</h1>
      <p class="lead">Updated {{ page.updatedAt | date: 'MMMM d, y' }}</p>
    </div>
  </section>

  <section class="section section--tight">
    <div class="container narrow legal-body">
      @for (section of page.sections; track section.heading) {
        <h2>{{ section.heading }}</h2>
        @for (paragraph of section.paragraphs; track paragraph) {
          <p>{{ paragraph }}</p>
        }
      }
      <a routerLink="/quote" class="btn btn--green">Back to quote</a>
    </div>
  </section>
}
