<header class="header">
  <div class="container header__bar">
    <a routerLink="/" class="logo" (click)="close()" aria-label="Four Star General Cleaning Service home">
      <span class="logo__stars" aria-hidden="true">★★★★</span>
      <span class="logo__text">
        <strong>FOUR STAR</strong>
        <small>GENERAL CLEANING SERVICE</small>
      </span>
    </a>

    <nav class="nav" [class.nav--open]="menuOpen" aria-label="Primary">
      @for (link of links; track link.path) {
        <a [routerLink]="link.path" routerLinkActive="is-active" (click)="close()">{{ link.label }}</a>
      }
      <a routerLink="/articles" routerLinkActive="is-active" (click)="close()" class="nav__mobile-only">Articles</a>
      <a routerLink="/special-offers" routerLinkActive="is-active" (click)="close()" class="nav__mobile-only">Offers</a>
      <a routerLink="/quote" class="btn btn--yellow nav__mobile-cta" (click)="close()">Get a Free Quote</a>
    </nav>

    <a routerLink="/quote" class="btn btn--yellow header__cta">Get a Free Quote</a>

    <button class="menu-btn" type="button" [attr.aria-expanded]="menuOpen" (click)="toggle()">
      <span class="sr-only">Menu</span>
      <span aria-hidden="true">{{ menuOpen ? '✕' : '☰' }}</span>
    </button>
  </div>
  <div class="container header__meta">
    <app-demo-badge />
    <a [href]="'tel:' + company.phoneTel">{{ company.phoneDisplay }}</a>
  </div>
</header>
