<section class="page-hero">
  <div class="container">
    <p class="eyebrow">Services</p>
    <h1>Commercial cleaning programs for NYC businesses</h1>
    <p class="lead">
      Office, janitorial, retail, medical, and green cleaning—each available as a recurring plan with quote preselection.
    </p>
    <a routerLink="/quote" class="btn btn--navy">Get a Free Quote</a>
  </div>
</section>

<section class="section section--tight">
  <div class="container card-grid services-grid">
    @for (service of services; track service.id) {
      <app-service-card [service]="service" />
    }
  </div>
</section>
